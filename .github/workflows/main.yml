name: Build TWRP for maya

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout device tree
      uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo dpkg --add-architecture i386
        sudo apt update
        sudo apt install -y \
          git-core gnupg flex bison build-essential zip curl \
          zlib1g-dev gcc-multilib g++-multilib libc6-dev-i386 \
          lib32ncurses5-dev x11proto-core-dev libx11-dev \
          lib32z1-dev libgl1-mesa-dev libxml2-utils xsltproc \
          unzip fontconfig

    - name: Setup repo tool
      run: |
        mkdir -p ~/bin
        curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
        chmod a+x ~/bin/repo
        echo "$HOME/bin" >> $GITHUB_PATH

    - name: Initialize TWRP source
      run: |
        mkdir twrp
        cd twrp
        repo init -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git -b twrp-9.0
        repo sync -j$(nproc)

    - name: Move device tree
      run: |
        cd twrp
        mkdir -p device/huawei
        mv ../android_device_huawei_maya device/huawei/maya

    - name: Build recovery
      run: |
        cd twrp
        source build/envsetup.sh
        lunch omni_maya-eng
        make clean
        make recoveryimage -j$(nproc)

    - name: Upload recovery
      uses: actions/upload-artifact@v4
      with:
        name: twrp-maya
        path: twrp/out/target/product/maya/recovery.img

name: Build TWRP for Honor 6 Play (MYA)

on:
  workflow_dispatch:
    inputs:
      device_tree_url:
        description: 'Device Tree URL (your fork)'
        required: true
        default: 'https://github.com/YOUR_USERNAME/android_device_huawei_mya'
      device_tree_branch:
        description: 'Device Tree Branch'
        required: true
        default: 'main'
      build_target:
        description: 'Build Target'
        required: true
        default: 'recovery'
        type: choice
        options:
          - recovery
          - boot

jobs:
  build:
    runs-on: ubuntu-20.04
    timeout-minutes: 120
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        
      - name: Setup Build Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git-core gnupg flex bison gperf build-essential \
            zip curl zlib1g-dev gcc-multilib g++-multilib \
            libc6-dev-i386 lib32ncurses5-dev x11proto-core-dev \
            libx11-dev lib32z-dev ccache libgl1-mesa-dev \
            libxml2-utils xsltproc unzip python3 python3-pip \
            bc libncurses5-dev libncursesw5-dev libssl-dev \
            repo
          
          # 设置 Python 2 兼容（Android 6.0 需要）
          sudo apt-get install -y python2
          sudo ln -sf /usr/bin/python2 /usr/bin/python
          
          # 配置 git
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          
      - name: Setup Repo Tool
        run: |
          mkdir -p ~/bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          echo "${HOME}/bin" >> $GITHUB_PATH
          
      - name: Initialize TWRP Manifest (Android 6.0)
        run: |
          mkdir -p ${{ github.workspace }}/workspace
          cd ${{ github.workspace }}/workspace
          
          # 使用 minimal TWRP manifest 的 6.0 分支
          repo init -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_omni.git -b twrp-6.0 --depth=1
          
      - name: Sync Source Code
        run: |
          cd ${{ github.workspace }}/workspace
          repo sync -c --force-sync --no-tags --no-clone-bundle -j$(nproc --all) || repo sync -c --force-sync --no-tags --no-clone-bundle -j$(nproc --all)
          
      - name: Clone Device Tree
        run: |
          cd ${{ github.workspace }}/workspace
          
          # 创建设备目录
          mkdir -p device/huawei/mya
          
          # 克隆你的设备树
          git clone ${{ github.event.inputs.device_tree_url }} -b ${{ github.event.inputs.device_tree_branch }} device/huawei/mya --depth=1
          
          # 检查关键文件是否存在
          ls -la device/huawei/mya/
          
      - name: Pre-build Setup (Android 6.0 Legacy Fixes)
        run: |
          cd ${{ github.workspace }}/workspace
          
          # Android 6.0 需要 Java 8
          sudo apt-get install -y openjdk-8-jdk
          export JAVA_HOME=/usr/lib/jvm/java-8-openjdk-amd64
          echo "JAVA_HOME=$JAVA_HOME" >> $GITHUB_ENV
          
          # 设置 Python 2 为默认（Android 6.0 构建需要）
          export PATH=/usr/bin:$PATH
          
          # 修复可能的权限问题
          chmod +x device/huawei/mya/vendorsetup.sh 2>/dev/null || true
          
      - name: Build TWRP
        run: |
          cd ${{ github.workspace }}/workspace
          
          # 设置环境变量
          export JAVA_HOME=/usr/lib/jvm/java-8-openjdk-amd64
          export PATH=$JAVA_HOME/bin:$PATH
          export ALLOW_MISSING_DEPENDENCIES=true
          
          # 加载构建环境
          source build/envsetup.sh
          
          # 选择设备（根据你的 omni_maya.mk，设备名可能是 maya 或 mya）
          # 尝试 maya
          lunch omni_maya-eng || lunch omni_mya-eng
          
          # 开始编译
          make -j$(nproc --all) ${{ github.event.inputs.build_target }}image
          
      - name: Check Build Output
        if: always()
        run: |
          cd ${{ github.workspace }}/workspace
          
          # 查找编译输出
          find out/target/product -name "*.img" -o -name "recovery*" 2>/dev/null | head -20
          
          # 显示目录结构
          ls -la out/target/product/*/ 2>/dev/null || echo "Build output directory not found"
          
      - name: Package Recovery
        if: success()
        run: |
          cd ${{ github.workspace }}/workspace/out/target/product
          
          PRODUCT_DIR=$(ls -d */ | head -1)
          cd "$PRODUCT_DIR"
          
          # 打包 recovery 镜像和 zip
          mkdir -p ${{ github.workspace }}/output
          
          # 复制 recovery.img
          if [ -f "recovery.img" ]; then
            cp recovery.img ${{ github.workspace }}/output/TWRP_Honor6Play_${{ github.event.inputs.build_target }}.img
            echo "RECOVERY_IMG=TWRP_Honor6Play_${{ github.event.inputs.build_target }}.img" >> $GITHUB_ENV
          fi
          
          # 如果有 zip 包也复制
          if ls *.zip 1> /dev/null 2>&1; then
            cp *.zip ${{ github.workspace }}/output/
          fi
          
          # 生成刷机脚本
          cat > ${{ github.workspace }}/output/flash_instructions.txt << 'EOF'
          荣耀畅玩6 (Honor 6 Play / MYA-AL10) TWRP 刷入方法：
          
          方法1 - Fastboot 刷入（推荐）：
          1. 解锁 Bootloader（华为官方申请解锁码）
          2. 进入 Fastboot 模式：关机后按住 音量下 + 电源键
          3. 连接电脑，打开命令提示符/终端
          4. 执行：fastboot flash recovery TWRP_Honor6Play_recovery.img
          5. 执行：fastboot reboot recovery
          
          方法2 - 通过现有 Recovery 刷入：
          1. 将 recovery.img 重命名为 recovery.img
          2. 放入 SD 卡或内部存储
          3. 通过现有第三方 Recovery 刷入
          
          注意事项：
          - 首次进入 TWRP 可能需要格式化 Data 分区（会清除所有数据）
          - 华为设备可能需要关闭强制加密
          - MT6737T 芯片，Android 6.0 系统
          EOF
          
      - name: Upload Build Artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: TWRP-Honor6Play-${{ github.run_number }}
          path: ${{ github.workspace }}/output/*
          retention-days: 30
          
      - name: Create Release
        if: success()
        uses: softprops/action-gh-release@v1
        with:
          tag_name: twrp-honor6play-${{ github.run_number }}
          name: TWRP for Honor 6 Play (Build ${{ github.run_number }})
          body: |
            ## TWRP Recovery for Honor 6 Play (MYA-AL10/MYA-TL10)
            
            **设备信息：**
            - 型号：荣耀畅玩6 / Honor 6 Play
            - 代号：MYA-AL10 / MYA-TL10
            - 芯片：联发科 MT6737T
            - 系统：Android 6.0 Marshmallow
            - 内核：3.18.19
            
            **编译信息：**
            - 构建目标：${{ github.event.inputs.build_target }}
            - 编译时间：${{ github.event.created_at }}
            - 工作流编号：${{ github.run_number }}
            
            **刷入方法：**
            1. 解锁 Bootloader
            2. 进入 Fastboot 模式（音量下 + 电源键）
            3. `fastboot flash recovery TWRP_Honor6Play_recovery.img`
            4. `fastboot reboot recovery`
            
            ⚠️ **警告：** 刷机有风险，请备份重要数据！
          files: ${{ github.workspace }}/output/*
          draft: false
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Cleanup
        if: always()
        run: |
          cd ${{ github.workspace }}
          rm -rf workspace
          sudo apt-get clean
